server:
  port: 8081

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mhp_platform?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 688748
  data:
    redis:
      host: localhost
      port: 6379
      database: 1

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

mhp:
  jwt:
    secret: campus-mhp-secret-key-2026-must-be-at-least-32-chars
    admin-expiration: 7200000
    user-expiration: 86400000

oss:
  type: local
  local-path: D:/Java/campus-mhp/oss/
  local-domain: http://localhost:8081

logging:
  level:
    com:
      mhp:
        mapper: debug
        service: info
        controller: info

# Knife4j / SpringDoc 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  cache:
    disabled: true
knife4j:
  # 增强模式会额外请求分组接口，易出现「文档请求异常」；关闭后走标准 OpenAPI 更稳定
  enable: false
  setting:
    language: zh_cn
